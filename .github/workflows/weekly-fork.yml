name: Test hebdomadaire sur fork

# Once a week (and on demand): the outside APIs the app reads still answer in the expected shape, and a real loop
# opens and closes in the app on forks of Base, Plasma and Ethereum (Aave v4, Morpho Blue) with live quotes (Velora,
# KyberSwap); on Ethereum the position also goes through every other mode in between (v4: change of collateral, of
# debt, refinance to another spoke and back; Morpho: refinance to Aave and back). A failure opens a
# GitHub issue (or comments on the open one); the next success closes it. No secret needed.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-fork
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node e2e/api-check.mjs

  fork:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1 WETH at 3x against USDC, the shared contract deployed from the app's button. Slippage 1 %: the fork stays at
          # its block while the live quotes move (the first run failed at close at the auto 0.1 %)
          - net: base
            chain: 8453
            hex: '0x2105'
            fork: https://mainnet.base.org
            env: "PAIR=WETH/USDC AMOUNT=1 LEV=3 SLIP='1 %'"
            # plain AMMs only: Base's oracle-priced pools quote from live state the frozen fork does not have, and a
            # route through them reverts there (ExecutionFailed() from the aggregator's executor, 15/11/2026)
            vite: 'VITE_VELORA_INCLUDE_DEXS=UniswapV3,UniswapV4,AerodromeSlipstream,AerodromeSlipstreamFactory3,PancakeswapV3 VITE_KYBER_INCLUDED_SOURCES=uniswapv3,uniswap-v4,aerodrome-cl,pancake-v3'
          # the pair used for real on Plasma: 1 000 USDe at 3x against GHO
          - net: plasma
            chain: 9745
            hex: '0x2611'
            fork: https://rpc.plasma.to
            env: "PAIR=USDe/GHO AMOUNT=1000 LEV=3 SLIP='1 %'"
          # Aave v4 on Ethereum (spoke Main): 1 000 USDC at 3x on WETH / USDC, flash loan from Morpho, Taker permit; then
          # WETH → wstETH, USDC → USDt, to the Bluechip spoke and back, and closed as wstETH / USDt
          - net: v4
            market: v4-ethereum
            chain: 1
            hex: '0x1'
            fork: https://ethereum-rpc.publicnode.com
            env: "COLL=WETH DEBT=USDC CAPITAL=USDC AMOUNT=1000 LEV=3 SLIP='1 %'"
            middle: |
              env COLL=WETH DEBT=USDC TARGET=wstETH SLIP='1 %' node e2e/run.cjs swap swap
              env COLL=wstETH DEBT=USDC TARGET=USDt SLIP='1 %' node e2e/run.cjs debt debt
              env COLL=wstETH DEBT=USDt TARGET='Ce spoke → spoke Bluechip' node e2e/run.cjs refi refi
              env COLL=wstETH DEBT=USDt TARGET='spoke Bluechip → ce spoke' node e2e/run.cjs refi refi2
            close: "COLL=wstETH DEBT=USDt SLIP='1 %'"
            # plain AMMs only, as on Base: Velora routes USDC → WETH through metric-v1 (oracle-priced), which reverts on
            # the frozen fork (16/11/2026)
            vite: 'VITE_VELORA_INCLUDE_DEXS=UniswapV3,UniswapV4,UniswapV2,PancakeswapV3,SushiSwapV3 VITE_KYBER_INCLUDED_SOURCES=uniswapv3,uniswap-v4,uniswap,pancake-v3,sushiswap-v3'
          # Morpho Blue on Ethereum: 1 000 USDC at 3x on wstETH / USDC (LLTV 86 %), its own contract deployed from the
          # app; then refinanced to Aave Ethereum (Prime) and back (LeverageExecutorMorpho.refinance)
          - net: morpho
            market: morpho-ethereum
            chain: 1
            hex: '0x1'
            fork: https://ethereum-rpc.publicnode.com
            env: "COLL=wstETH DEBT=USDC CAPITAL=USDC AMOUNT=1000 LEV=3 SLIP='1 %'"
            middle: |
              env COLL=wstETH DEBT=USDC TARGET='Morpho → Aave Ethereum (Prime)' WAIT=60000 node e2e/run.cjs refi refi
              env COLL=wstETH DEBT=USDC TARGET='Aave Ethereum (Prime) → Morpho' WAIT=60000 node e2e/run.cjs refi refi2
            vite: 'VITE_VELORA_INCLUDE_DEXS=UniswapV3,UniswapV4,UniswapV2,PancakeswapV3,SushiSwapV3 VITE_KYBER_INCLUDED_SOURCES=uniswapv3,uniswap-v4,uniswap,pancake-v3,sushiswap-v3'
    defaults:
      run:
        working-directory: app
    env:
      MARKET: ${{ matrix.market || matrix.net }}
      CHAIN_HEX: ${{ matrix.hex }}
      E2E_STRICT: '1'
      WAIT: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: npm ci
      # the browser driver of e2e/run.cjs (not an app dependency)
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Fork
        run: |
          anvil --fork-url ${{ matrix.fork }} --chain-id ${{ matrix.chain }} --port 8545 > anvil.log 2>&1 &
          for i in $(seq 60); do cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 && break; sleep 2; done
          # public RPCs sometimes time out on the fork's first reads (15/11/2026): retried after a pause
          for i in 1 2 3; do NET=${{ matrix.net }} NO_DEPLOY=1 FORK_URL=${{ matrix.fork }} bash e2e/fork.sh && break; [ $i = 3 ] && exit 1; sleep 20; done
      - name: App
        run: |
          env ${{ matrix.vite }} VITE_RPC_URL_${{ matrix.chain }}=http://127.0.0.1:8545 npx vite --port 5173 --strictPort --base / > vite.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:5173/ >/dev/null && break; sleep 2; done
      - name: Déployer le contrat depuis l'app
        run: |
          node e2e/run.cjs deploy deploy | tee deploy.log
          echo "EXECUTOR=$(grep -o '0x[0-9a-fA-F]\{40\}' deploy.log | tail -1)" >> "$GITHUB_ENV"
      # one retry after a pause: aggregator APIs rate-limit by IP (KyberSwap answers 429), nothing was sent on a failure
      # before signing
      - name: Ouvrir
        run: env ${{ matrix.env }} node e2e/run.cjs open open || (sleep 120 && env ${{ matrix.env }} node e2e/run.cjs open open2)
      # each move once, in order (no retry: a move that went through cannot be replayed)
      - name: Autres modes
        if: matrix.middle
        run: |
          set -e
          ${{ matrix.middle }}
      - name: Fermer
        run: env ${{ matrix.close || matrix.env }} node e2e/run.cjs close close || (sleep 120 && env ${{ matrix.close || matrix.env }} node e2e/run.cjs close close2)
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-${{ matrix.net }}
          path: |
            app/*.png
            app/*.log
          retention-days: 14

  report:
    needs: [api, fork]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Ouvrir, commenter ou fermer le ticket
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ needs.api.result != 'success' || needs.fork.result != 'success' }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Test hebdomadaire sur fork en échec"
          OPEN=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ "$FAILED" = true ]; then
            BODY="Le test hebdomadaire a échoué (API : ${{ needs.api.result }}, forks : ${{ needs.fork.result }}). Détails et captures : $RUN"
            if [ -n "$OPEN" ]; then gh issue comment "$OPEN" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --comment "Le test hebdomadaire repasse : $RUN"
          fi
