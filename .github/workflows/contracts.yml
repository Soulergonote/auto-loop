name: Tester les contrats

on:
  push:
    branches: [main]
    paths: ['contracts/**', '.github/workflows/contracts.yml']
  pull_request:
    paths: ['contracts/**', '.github/workflows/contracts.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - uses: actions/cache@v6
        with:
          path: contracts/lib
          key: contracts-lib-${{ hashFiles('contracts/script/setup.sh') }}
      - run: bash script/setup.sh
      # fork tests need archive RPCs: run them locally (see contracts/README.md)
      - run: forge test --no-match-path 'test/fork/*'
