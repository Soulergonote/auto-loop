[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.27"
evm_version = "cancun"  # the live Aave v3 Pool on Base uses Cancun opcodes (fork reverts with NotActivated under shanghai)
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# required by the Aave test deployment helpers (they only read .env through sed + cast)
ffi = true

# LeverageExecutorV4 only: compiled through the IR pipeline, which keeps it under the 24 KB contract size limit
additional_compiler_profiles = [{ name = "v4", via_ir = true }]
compilation_restrictions = [{ paths = "src/LeverageExecutorV4.sol", via_ir = true }]

[fuzz]
runs = 256

[rpc_endpoints]
base = "${BASE_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
