<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Auto-loop : ouvrir, augmenter et fermer une position à levier sur Aave v3 ou Morpho Blue en une transaction (flash loan, swap, dépôt)." />
    <meta name="theme-color" content="#f3f2ec" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Auto-loop</title>
    <script>
      // saved theme (ui/theme.ts) before the first paint, so that a violet or magenta visit never flashes blue
      try {
        var t = localStorage.getItem('auto-loop:theme')
        if (t === 'violet' || t === 'magenta') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
